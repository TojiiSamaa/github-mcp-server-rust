name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  # Dossier du workspace Rust : « . » ici, « rust » dans le fork public (scripts/publier.sh le réécrit).
  RUST_DIR: rust

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ env.RUST_DIR }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: ${{ env.RUST_DIR }}
      - name: Build
        run: cargo build --release --locked -p ghmcp --target ${{ matrix.target }}
      - name: Archive et sha256
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="ghmcp-${TAG}-${TARGET}"
          mkdir "${name}"
          bin=ghmcp; [ "${RUNNER_OS}" = "Windows" ] && bin=ghmcp.exe
          cp "target/${TARGET}/release/${bin}" README.md NOTICE "${name}/"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            7z a "${name}.zip" "${name}" > /dev/null
            file="${name}.zip"
          else
            tar -czf "${name}.tar.gz" "${name}"
            file="${name}.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "${file}" > "${file}.sha256"; else shasum -a 256 "${file}" > "${file}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ghmcp-${{ matrix.target }}
          path: |
            ${{ env.RUST_DIR }}/ghmcp-*.tar.gz
            ${{ env.RUST_DIR }}/ghmcp-*.zip
            ${{ env.RUST_DIR }}/ghmcp-*.sha256
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Créer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
