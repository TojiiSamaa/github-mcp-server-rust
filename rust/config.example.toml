# Exemple FICTIF de configuration ghmcp. Copier hors du dépôt :
#   Windows : %APPDATA%\ghmcp\config.toml   Linux/macOS : ~/.config/ghmcp/config.toml
# ou passer --config <fichier> / GHMCP_CONFIG. Aucun secret ici : seulement où les lire.

default_account = "alice-test"

[[accounts]]
name = "alice-test"
kind = "classic"                 # classic | fine | app
token_env = "GHMCP_ALICE_TOKEN"  # variable contenant ghp_FAKE...

[[accounts]]
name = "bob-ci"
kind = "fine"
token_file = "/chemin/vers/bob-ci.token"

[[accounts]]
name = "carol-cmd"
kind = "fine"
# Jeton lu sur la sortie d'une commande (programme + arguments, sans shell). Ordre : token_env > token_file > token_cmd.
token_cmd = ["gestionnaire", "lire", "jeton-fictif"]

[[accounts]]
name = "robot-app"
kind = "app"
app_id = 123456
installation_id = 7654321
private_key_file = "/chemin/vers/robot-app.private-key.pem"
# api_url = "https://ghe.example.invalid/api/v3"   # GitHub Enterprise Server (défaut : https://api.github.com)

# Sections réservées, lues par leurs crates (format défini par elles) :
# [webhook]       ext-hooks / activity : secret de signature, chemin d'écoute
# [poller]        activity : relève périodique (notifications, PR, runs…)
# [[rules]]       automation : quand tel événement -> telle destination / action
# [destinations]  automation : webhooks sortants, commandes locales
# [actions]       automation : actions GitHub déclenchées par les règles
# [dispatch]      activity : issue ouverte / commentée sur un dépôt suivi -> agent responsable via l'API du Centre
# [ecriture]      server : écriture bornée (défaut) ; mode = "libre" lève la borne
# [connecter]     permissions : ghmcp_connecter / ghmcp_autotest (Centre, propriétaire, dépôt de test)

# [dispatch]
# centre_url = "http://centre.example.invalid:8796"   # ou centre_url_env = "NOM_DE_VARIABLE"
# token_env = "CENTRE_API_TOKEN"                       # jeton Bearer du Centre (variable, jamais en clair)
# defaut_agent = "agent-de-garde"                      # facultatif : session de repli
# [dispatch.repos."example-org/example-repo"]
# dossier = "/srv/code/example-repo"                   # nouvelle session ici si aucun agent n'est connu
# agent = "session-id"                                 # facultatif : agent attitré du dépôt

# [ecriture]
# mode = "borne"   # "libre" : fusion, suppression et écriture sur la branche par défaut redeviennent possibles

# [connecter]
# centre_url = "http://centre.example.invalid:8796"   # ou centre_url_env = "NOM_DE_VARIABLE"
# token_file = "/chemin/ghmcp-centre.jeton"           # ou token_env : Bearer propre à ghmcp (github_acces.py creer-jeton ghmcp)
# proprietaire = "example-user"                        # login attendu de chaque jeton, propriétaire pré-rempli des jetons fins
# depot_test = "example-user/ghmcp-autotest"           # sondes de lecture et écriture bornée (label, variable) : dépôt jetable
# adresse_publique = "https://hooks.example.invalid"   # facultatif : récepteur de webhooks (listé, non sondé)
